name: Publish API docs to GitHub Pages

# Exports the FastAPI OpenAPI schema and publishes it as an interactive
# Swagger UI reference (read-only: there is no server or database on Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt passlib pyjwt
      - name: Export OpenAPI schema
        env:
          DATABASE_URL: postgresql+asyncpg://demo:demo@localhost:5432/demo
        run: |
          mkdir -p site
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('site/openapi.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)"
          cp docs-site/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
